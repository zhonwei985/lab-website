name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# CI 只需要讀取程式碼，限制 GITHUB_TOKEN 為唯讀
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check script.js syntax
        run: node --check script.js

      - name: Validate HTML (tag matching + local link/image/css/js references)
        run: python3 .github/scripts/validate.py
